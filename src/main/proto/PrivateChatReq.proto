syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PrivateChatReqOuterClass";

message PrivateChatReq {
	message _BeyondCostumeShareCode {
		bytes FEPAFANMNLK = 7;
	}
	oneof content {
		_BeyondCostumeShareCode beyond_costume_share_code = 13;
		uint32 icon = 7;
		string text = 5;
	}
	uint32 target_uid = 6;
}
