syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DetailAbilityInfoOuterClass";

import "AbilityString.proto";

message DetailAbilityInfo {
	uint32 instanced_modifier_id = 3;
	int32 modifier_local_id = 12;
	int32 local_id = 14;
	uint32 instanced_ability_id = 1;
	AbilityString parent_ability_name = 9;
	uint32 caster_id = 8;
}
