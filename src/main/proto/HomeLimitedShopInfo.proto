syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeLimitedShopInfoOuterClass";

import "Vector.proto";

message HomeLimitedShopInfo {
	fixed32 next_close_time = 3;
	uint32 uid = 10;
	Vector djinn_pos = 14;
	fixed32 next_open_time = 5;
	fixed32 next_guest_open_time = 1;
	Vector djinn_rot = 7;
}
