syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtBulletHitNotifyOuterClass";

import "ForwardType.proto";
import "HitColliderType.proto";
import "Vector.proto";

message EvtBulletHitNotify {
	uint32 single_bullet_id = 20000;
	uint32 entity_id = 12;
	int32 hit_box_index = 4;
	HitColliderType hit_collider_type = 3;
	uint32 hit_entity_id = 20001;
	uint32 forward_peer = 9;
	Vector hit_point = 14;
	ForwardType forward_type = 2;
	Vector hit_normal = 5;
}
