syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OCECKEMKIGJOuterClass";

message OCECKEMKIGJ {
	uint32 level_id = 1;
	bool is_played = 3;
	bool is_finished = 4;
	uint32 IFFKFLBCHHL = 20001;
	uint32 ALNHCONFHHO = 20002;
	repeated uint32 EGCJHEIONKK = 20000;
	bool is_unlock = 2;
	uint32 JPBOIPOIGNH = 20003;
}
