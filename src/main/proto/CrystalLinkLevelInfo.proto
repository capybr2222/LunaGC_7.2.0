syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CrystalLinkLevelInfoOuterClass";

import "CrystalLinkTeamInfo.proto";

message CrystalLinkLevelInfo {
	uint32 level_id = 1;
	uint32 best_score = 3;
	bool is_open = 2;
	repeated CrystalLinkTeamInfo team_info_list = 4;
}
