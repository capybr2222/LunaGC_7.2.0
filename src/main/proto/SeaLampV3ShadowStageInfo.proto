syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SeaLampV3ShadowStageInfoOuterClass";

import "SeaLampV3ShadowLevelInfo.proto";

message SeaLampV3ShadowStageInfo {
	bool is_open = 2;
	uint32 stage_id = 1;
	repeated SeaLampV3ShadowLevelInfo level_info_list = 3;
}
