syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VintagePresentStageDataOuterClass";

import "VintagePresentLevelData.proto";

message VintagePresentStageData {
	uint32 stage_id = 1;
	map<uint32, VintagePresentLevelData> present_level_map = 4;
	bool is_finish = 3;
	bool is_open = 2;
	uint32 open_time = 5;
}
