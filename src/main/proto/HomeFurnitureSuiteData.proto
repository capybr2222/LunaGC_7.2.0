syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeFurnitureSuiteDataOuterClass";

import "Vector.proto";

message HomeFurnitureSuiteData {
	uint32 suite_id = 13;
	bool is_allow_summon = 2;
	repeated int32 included_furniture_index_list = 1;
	uint32 guid = 9;
	Vector spawn_pos = 3;
}
