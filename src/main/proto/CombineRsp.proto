syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CombineRspOuterClass";

import "ItemParam.proto";

message CombineRsp {
	uint32 combine_count = 14;
	repeated ItemParam FBMBEJKABDH = 20004;
	repeated ItemParam DAPJDPKECGP = 20000;
	repeated ItemParam FIHLCAAADMG = 20002;
	repeated ItemParam result_item_list = 50003;
	int32 retcode = 2;
	uint64 avatar_guid = 1;
	uint32 combine_id = 8;
	repeated ItemParam totalExtraItemList = 50004;
	repeated ItemParam cost_item_list = 9;
}
