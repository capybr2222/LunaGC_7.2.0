syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeMarkPointSceneDataOuterClass";

import "HomeMarkPointFurnitureData.proto";
import "Vector.proto";

message HomeMarkPointSceneData {
	uint32 scene_id = 11;
	Vector safe_point_pos = 20001;
	uint32 module_id = 15;
	repeated HomeMarkPointFurnitureData furniture_list = 4;
	Vector teapot_spirit_pos = 20000;
}
