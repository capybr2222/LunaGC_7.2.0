syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AnchorPointDataOuterClass";

import "Vector.proto";

message AnchorPointData {
	uint32 material_id = 10;
	uint32 end_time = 6;
	uint32 anchor_point_id = 11;
	Vector pos = 1;
	Vector rot = 15;
	uint32 scene_id = 12;
}
