syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_OneShotDungeonSettleInfoOuterClass";

message _OneShotDungeonSettleInfo {
	uint32 level_id = 10;
	uint32 score = 11;
	uint32 AHMFDCPCCGF = 20002;
	uint32 GAMLOHOKPAJ = 20001;
	uint32 MGGJPDGCECM = 20000;
	bool is_new_record = 7;
}
