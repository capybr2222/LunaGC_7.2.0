syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtBeingHealedNotifyOuterClass";

message EvtBeingHealedNotify {
	string JONDCAMLJOF = 2;
	uint32 target_id = 8;
	uint32 source_id = 4;
	float heal_amount = 20003;
	bool AFAHAOFIJJO = 13;
	float real_heal_amount = 20001;
}
