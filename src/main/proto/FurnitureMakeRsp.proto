syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FurnitureMakeRspOuterClass";

import "BBJEJOLHJGL.proto";
import "CEIDAKMCDHC.proto";
import "FurnitureMakeBeHelpedData.proto";
import "FurnitureMakeMakeInfo.proto";
import "FurnitureMakeSlot.proto";

message FurnitureMakeRsp {
	int32 retcode = 15;
	uint32 _furniture_make_slot_num = 2;
	repeated FurnitureMakeBeHelpedData helped_data_list = 13;
	FurnitureMakeSlot furniture_make_slot = 10;
	repeated BBJEJOLHJGL FGODNAPHLGL = 50000;
	repeated FurnitureMakeMakeInfo make_info_list = 9;
	repeated CEIDAKMCDHC NDADFCDJOBK = 20000;
}
