syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AsterMidDetailInfoOuterClass";

import "AsterMidCampInfo.proto";

message AsterMidDetailInfo {
	uint32 collect_count = 3;
	bool is_open = 1;
	uint32 begin_time = 4;
	repeated AsterMidCampInfo camp_list = 2;
}
