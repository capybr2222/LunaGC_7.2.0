syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_RankedMatchSnowBallSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _RankedMatchSnowBallSettleInfo {
	bool is_new_record = 8;
	GalleryStopReason reason = 5;
	uint32 score = 3;
	uint32 level_id = 2;
	uint32 item_num = 10;
}
