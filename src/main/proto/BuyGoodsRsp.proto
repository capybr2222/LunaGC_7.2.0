syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BuyGoodsRspOuterClass";

import "ShopGoods.proto";

message BuyGoodsRsp {
	int32 retcode = 12;
	ShopGoods goods = 50000;
	uint32 buy_count = 8;
	uint32 shop_type = 6;
	repeated ShopGoods goods_list = 7;
}
