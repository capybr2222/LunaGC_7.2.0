syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LPGFAFGCFKOOuterClass";

import "_ActivityAvatarInfo.proto";

message LPGFAFGCFKO {
	bool is_open = 1;
	bool is_finish = 12;
	repeated _ActivityAvatarInfo GPMEFKHPBFK = 9;
	uint32 level_id = 6;
	uint32 best_score = 5;
}
