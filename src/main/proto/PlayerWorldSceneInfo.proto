syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerWorldSceneInfoOuterClass";

import "MapLayerInfo.proto";
import "_LimitedRegionInfo.proto";

message PlayerWorldSceneInfo {
	MapLayerInfo _map_layer_info = 3;
	uint32 scene_id = 8;
	_LimitedRegionInfo _limited_region_info = 9;
	bool is_locked = 7;
	repeated uint32 scene_tag_id_list = 11;
}
