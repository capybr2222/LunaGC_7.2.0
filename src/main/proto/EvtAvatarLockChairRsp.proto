syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtAvatarLockChairRspOuterClass";

import "Vector.proto";

message EvtAvatarLockChairRsp {
	uint64 chair_id = 1;
	int32 retcode = 4;
	Vector position = 13;
	int32 direction = 11;
	uint32 entity_id = 14;
}
