syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerCookRspOuterClass";

import "CookRecipeData.proto";
import "ItemParam.proto";

message PlayerCookRsp {
	int32 retcode = 9;
	repeated ItemParam extral_item_list = 11;
	uint32 cook_count = 14;
	repeated ItemParam item_list = 5;
	CookRecipeData recipe_data = 13;
	uint32 qte_quality = 1;
}
