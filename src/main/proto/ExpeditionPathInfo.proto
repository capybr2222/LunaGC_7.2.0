syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ExpeditionPathInfoOuterClass";

import "ExpeditionState.proto";

message ExpeditionPathInfo {
	uint32 challenge_id = 9;
	uint32 HPIHFPPEGEB = 20003;
	uint32 LGBBIHMBIOM = 20001;
	ExpeditionState state = 2;
	uint32 DAEPBFLMGIA = 20000;
	uint32 start_time = 3;
	repeated uint32 avatar_id_list = 4;
	uint32 KALHHMPCIDP = 50003;
	float bonus_probability = 8;
	uint32 NLLIPHBOCCE = 50004;
}
