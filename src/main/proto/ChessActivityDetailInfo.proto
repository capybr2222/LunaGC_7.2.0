syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChessActivityDetailInfoOuterClass";

message ChessActivityDetailInfo {
	uint32 MNMFHCLBLMH = 20001;
	uint32 exp = 2;
	uint32 content_close_time = 8;
	uint32 level = 1;
	bool is_teach_dungeon_finished = 3;
	repeated uint32 finished_map_id_list = 6;
	uint32 MMJCFABPFPE = 20000;
	uint32 AIHKOHFLHLC = 20002;
	bool is_content_closed = 9;
}
