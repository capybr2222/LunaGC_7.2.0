syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LockedPersonallineDataOuterClass";

message LockedPersonallineData {
	enum LockReason {
		LEVEL = 0;
		QUEST = 1;
	}
	message _QuestParam {
		uint32 chapter_id = 8;
		uint32 quest_id = 2;
	}
	oneof param {
		_QuestParam quest_param = 10;
		uint32 chapter_id = 1;
		uint32 level = 3;
	}
	uint32 personal_line_id = 12;
	LockReason lock_reason = 11;
}
