syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanternRiteV6ParkourSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _LanternRiteV6ParkourSettleInfo {
	uint32 collect_num = 9;
	uint32 _max_collect_num = 13;
	uint32 level_id = 2;
	GalleryStopReason reason = 1;
	bool is_new_record = 7;
	uint32 score = 4;
	uint32 use_time = 6;
}
