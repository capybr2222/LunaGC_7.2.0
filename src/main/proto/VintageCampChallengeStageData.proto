syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VintageCampChallengeStageDataOuterClass";

import "VintageCampChallengeLevelData.proto";

message VintageCampChallengeStageData {
	bool is_open = 3;
	uint32 open_time = 6;
	uint32 stage_id = 1;
	bool is_finish = 4;
	map<uint32, VintageCampChallengeLevelData> camp_level_map = 2;
	uint32 max_finished_level = 5;
}
