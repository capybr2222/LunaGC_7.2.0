syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarLifeStateChangeNotifyOuterClass";

import "PlayerDieType.proto";
import "ServerBuff.proto";

message AvatarLifeStateChangeNotify {
	uint32 life_state = 11;
	uint64 avatar_guid = 12;
	uint32 move_reliable_seq = 2;
	PlayerDieType die_type = 3;
	string attack_tag = 7;
	repeated ServerBuff server_buff_list = 15;
	repeated string EEOIMNHKALK = 10;
	uint32 source_entity_id = 1;
	uint32 LDAODDFLPGB = 4;
	uint32 client_sequence_id = 14;
}
