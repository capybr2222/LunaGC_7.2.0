syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TrialAvatarActivityRewardDetailInfoOuterClass";

message TrialAvatarActivityRewardDetailInfo {
	repeated uint32 _passed_training_step_list = 20000;
	bool _is_avatar_owned = 20003;
	uint32 reward_id = 11;
	bool passed_dungeon = 20004;
	bool received_reward = 20006;
	bool is_can_take_reward = 20002;
	repeated uint32 _available_training_step_list = 20001;
	uint32 trial_avatar_index_id = 1;
	bool _is_skip_training = 20005;
}
