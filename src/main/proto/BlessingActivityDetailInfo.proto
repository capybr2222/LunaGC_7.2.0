syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BlessingActivityDetailInfoOuterClass";

message BlessingActivityDetailInfo {
	uint32 HLGJOMHPMDA = 20002;
	bool is_content_closed = 2;
	uint32 next_refresh_time = 7;
	uint32 ppbchanjknf = 50001;
	bool is_activated = 1;
	map<uint32, uint32> pic_num_map = 5;
	uint32 DKHOJDNIKGN = 20000;
	uint32 content_close_time = 8;
}
