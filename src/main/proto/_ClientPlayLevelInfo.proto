syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_ClientPlayLevelInfoOuterClass";

import "_ClientPlayDetailInfo.proto";

message _ClientPlayLevelInfo {
	uint32 level_id = 15;
	uint32 ILGIBAJDEBD = 50000;
	uint32 best_record = 14;
	bool is_open = 5;
	_ClientPlayDetailInfo detail_info = 13;
	uint32 PKBFAOEKLDP = 50001;
}
