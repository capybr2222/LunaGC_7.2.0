syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtBulletMoveNotifyOuterClass";

import "ForwardType.proto";
import "Vector.proto";

message EvtBulletMoveNotify {
	uint32 entity_id = 2;
	Vector cur_pos = 3;
	bool EOCBPPKDLBH = 14;
	ForwardType forward_type = 15;
}
