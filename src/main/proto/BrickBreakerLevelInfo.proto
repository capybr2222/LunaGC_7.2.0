syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BrickBreakerLevelInfoOuterClass";

message BrickBreakerLevelInfo {
	repeated uint32 CFMEKCCEEPD = 7;
	uint32 level_id = 1;
	repeated uint32 DDKLHHHMMFJ = 50001;
	bool is_finish = 2;
	uint32 max_score = 5;
	bool is_can_start = 6;
	repeated uint32 chosen_avatar_list = 3;
}
