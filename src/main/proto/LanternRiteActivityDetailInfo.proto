syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanternRiteActivityDetailInfoOuterClass";

import "LanternProjectionInfo.proto";
import "LanternRiteFireworksInfo.proto";
import "SalvageStageInfo.proto";

message LanternRiteActivityDetailInfo {
	repeated SalvageStageInfo stage_info_list = 2;
	bool is_content_closed = 6;
	LanternRiteFireworksInfo fireworks_info = 5;
	LanternProjectionInfo projection_info = 1;
	bool APDGHACJHNN = 20000;
	bool BBACLKCHIMC = 20001;
}
