syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WidgetDoBagReqOuterClass";

import "WidgetCreateLocationInfo.proto";
import "WidgetCreatorInfo.proto";

message WidgetDoBagReq {
	oneof op_info {
		WidgetCreatorInfo widget_creator_info = 1416;
		WidgetCreateLocationInfo location_info = 1628;
	}
	uint32 material_id = 1;
}
