syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassScheduleOuterClass";

import "BattlePassCycle.proto";
import "BattlePassProduct.proto";
import "BattlePassRewardPlanOption.proto";
import "BattlePassRewardTag.proto";
import "BattlePassUnlockStatus.proto";

message BattlePassSchedule {
	BattlePassProduct product_info = 4;
	bool is_viewed = 12;
	BattlePassUnlockStatus unlock_status = 13;
	repeated BattlePassRewardTag reward_taken_list = 1;
	uint32 end_time = 10;
	BattlePassCycle cur_cycle = 6;
	uint32 schedule_id = 15;
	bool is_extra_paid_reward_taken = 11;
	bool JIPEKMKKHOI = 8;
	uint32 begin_time = 9;
	uint32 level = 5;
	uint32 paid_platform_flags = 20002;
	uint32 cur_cycle_points = 20001;
	uint32 point = 3;
	repeated BattlePassRewardPlanOption _reward_plan_option_list = 2;
}
