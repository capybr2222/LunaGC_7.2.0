syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtAnimatorParameterInfoOuterClass";

import "AnimatorParameterValueInfo.proto";

message EvtAnimatorParameterInfo {
	bool is_server_cache = 10;
	int32 name_id = 2;
	AnimatorParameterValueInfo value = 9;
	uint32 entity_id = 7;
}
