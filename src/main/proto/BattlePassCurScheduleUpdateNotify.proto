syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassCurScheduleUpdateNotifyOuterClass";

import "BattlePassSchedule.proto";

message BattlePassCurScheduleUpdateNotify {
	bool is_viewed = 15;
	bool have_cur_schedule = 2;
	bool phlgoaddenj = 8;
	BattlePassSchedule cur_schedule = 12;
	uint32 _battle_pass_plan = 3;
}
