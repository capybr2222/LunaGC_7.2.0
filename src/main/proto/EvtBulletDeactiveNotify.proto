syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtBulletDeactiveNotifyOuterClass";

import "ForwardType.proto";
import "Vector.proto";

message EvtBulletDeactiveNotify {
	uint32 entity_id = 5;
	Vector disappear_pos = 1;
	ForwardType forward_type = 9;
}
