syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SlimeCannonLevelInfoOuterClass";

message _SlimeCannonLevelInfo {
	uint32 level_id = 6;
	uint32 use_time = 1;
	uint32 score = 14;
	bool is_open = 8;
	uint32 _max_combo_num = 9;
	uint32 _max_wave = 15;
	bool is_finish = 13;
}
