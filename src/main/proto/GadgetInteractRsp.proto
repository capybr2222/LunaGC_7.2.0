syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GadgetInteractRspOuterClass";

import "InterOpType.proto";
import "InteractType.proto";

message GadgetInteractRsp {
	InteractType interact_type = 12;
	int32 retcode = 14;
	uint32 hebnjoabfoo = 10;
	uint32 gadget_id = 2;
	uint32 gadget_entity_id = 8;
	InterOpType op_type = 3;
}
