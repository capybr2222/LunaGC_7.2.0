syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OneoffGatherPointDetectorDataOuterClass";

import "Vector.proto";

message OneoffGatherPointDetectorData {
	uint32 map_layer_id = 50000;
	uint32 scene_id = 4;
	uint32 config_id = 8;
	uint32 group_id = 5;
	uint32 hint_radius = 11;
	Vector hint_center_pos = 12;
	bool is_all_collected = 15;
	bool is_hint_valid = 3;
	uint32 material_id = 9;
	uint32 _map_layer_id_x = 50001;
}
