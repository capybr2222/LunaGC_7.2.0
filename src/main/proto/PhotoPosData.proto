syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PhotoPosDataOuterClass";

import "Vector.proto";

message PhotoPosData {
	bool is_view = 15;
	bool is_open = 4;
	uint32 pos_id = 13;
	uint32 open_time = 11;
	Vector center = 5;
	repeated uint32 MNLKHICGNNH = 14;
}
