syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_PenumbraAdventureTargetShootingLevelInfoOuterClass";

message _PenumbraAdventureTargetShootingLevelInfo {
	uint32 level_id = 1;
	uint32 _max_combo_num = 3;
	uint32 max_score = 2;
	bool is_finish = 4;
	bool is_open = 5;
}
