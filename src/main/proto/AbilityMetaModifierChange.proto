syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMetaModifierChangeOuterClass";

import "AbilityAttachedModifier.proto";
import "AbilityString.proto";
import "ModifierAction.proto";
import "ModifierProperty.proto";

message AbilityMetaModifierChange {
	repeated ModifierProperty properties = 1;
	AbilityString parent_ability_name = 6;
	bool NBBGHMGOALL = 20001;
	bool is_attached_parent_ability = 12;
	uint64 OCAMKBCONED = 4;
	AbilityString parent_ability_override = 10;
	float MFBDIICANOF = 2;
	uint32 apply_entity_id = 15;
	ModifierAction action = 9;
	uint32 server_buff_uid = 7;
	int32 modifier_local_id = 14;
	AbilityAttachedModifier attached_instanced_modifier = 8;
	bool PKJMOLPCEBG = 20002;
}
