syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SalesmanActivityDetailInfoOuterClass";

import "SalesmanStatusType.proto";

message SalesmanActivityDetailInfo {
	bool CCIDPKHDGLB = 20002;
	SalesmanStatusType status = 2;
	map<uint32, uint32> selected_reward_id_map = 13;
	uint32 FNPCMPBIIMP = 20005;
	bool LOCIIDPOHAH = 20001;
	uint32 KMKFHBKGBOH = 20000;
	uint32 IKCLPCPHAJF = 20006;
	uint32 DILMJEONOCC = 20003;
	uint32 KFEIFMLHHGM = 20004;
	uint32 day_index = 11;
}
