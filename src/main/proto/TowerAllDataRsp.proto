syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerAllDataRspOuterClass";

import "TowerCurLevelRecord.proto";
import "TowerFloorRecord.proto";
import "TowerMonthlyBrief.proto";

message TowerAllDataRsp {
	enum _TowerSkipFloorState {
		TOWER_SKIP_FLOOR_STATE_NONE = 0;
		TOWER_SKIP_FLOOR_STATE_CAN_NOT_SKIP = 1;
		TOWER_SKIP_FLOOR_STATE_HAS_REWARD = 2;
		TOWER_SKIP_FLOOR_STATE_TAKEN_REWARD = 3;
	}
	uint32 tower_schedule_id = 6;
	uint32 EFABCDDNIFA = 20001;
	uint32 next_schedule_change_time = 257;
	int32 retcode = 9;
	TowerCurLevelRecord cur_level_record = 8;
	uint32 commemorative_reward_id = 20000;
	map<uint32, uint32> skip_floor_granted_reward_item_map = 2;
	bool is_finished_entrance_floor = 7;
	map<uint32, uint32> floor_open_time_map = 3;
	bool is_first_interact = 10;
	uint32 valid_tower_record_num = 20002;
	uint32 skip_to_floor_index = 20003;
	repeated TowerFloorRecord tower_floor_record_list = 14;
	uint32 GKIFECKDHKD = 20004;
	TowerMonthlyBrief monthly_brief = 11;
	_TowerSkipFloorState _tower_skip_floor_state = 662;
	uint32 schedule_start_time = 5;
	TowerMonthlyBrief last_schedule_monthly_brief = 1725;
}
