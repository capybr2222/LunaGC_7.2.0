syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeSceneArrangementInfoOuterClass";

import "HomeBlockArrangementInfo.proto";
import "HomeFurnitureData.proto";
import "MLLBFLGFLDN.proto";
import "Vector.proto";

message HomeSceneArrangementInfo {
	repeated HomeBlockArrangementInfo block_arrangement_info_list = 15;
	uint32 scene_id = 1;
	repeated HomeFurnitureData stair_list = 20000;
	Vector IILKHACKPAI = 20002;
	HomeFurnitureData main_house = 6;
	Vector born_pos = 5;
	bool KGGKIAHPDGO = 20006;
	uint32 bgm_id = 13;
	Vector djinn_pos = 14;
	Vector KAPPOHDCAKP = 50003;
	uint32 tmp_version = 12;
	uint32 comfort_value = 2;
	bool OADJEMPMKIF = 20005;
	repeated HomeFurnitureData door_list = 20003;
	Vector MEEACPBAEJN = 20001;
	repeated MLLBFLGFLDN CKDKECLLALB = 50007;
}
