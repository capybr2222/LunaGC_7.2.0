syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FIIHDNCNDHHOuterClass";

import "FHDOGFCDKDK.proto";

message FIIHDNCNDHH {
	uint32 start_time = 15;
	uint64 guid = 1;
	repeated FHDOGFCDKDK COKFKPJNKHC = 20000;
	repeated uint32 winner_uid_list = 3;
	uint32 finish_time = 14;
}
