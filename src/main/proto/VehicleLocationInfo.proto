syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VehicleLocationInfoOuterClass";

import "Vector.proto";

message VehicleLocationInfo {
	uint32 gadget_id = 13;
	repeated uint32 uid_list = 11;
	float max_hp = 9;
	uint32 entity_id = 6;
	Vector rot = 15;
	uint32 owner_uid = 1;
	Vector pos = 8;
	float cur_hp = 5;
}
