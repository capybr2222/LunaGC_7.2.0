syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureSeelieRegionDataOuterClass";

import "Vector.proto";

message TreasureSeelieRegionData {
	uint32 open_time = 3;
	bool is_open = 2;
	uint32 OKGPCPGPPMG = 20000;
	Vector region_center_pos = 8;
	uint32 region_id = 6;
	uint32 scene_id = 10;
	uint32 LPGPONIONFK = 20001;
	uint32 pdhmghbaedh = 50002;
	bool is_done = 7;
	float region_radius = 9;
}
