syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassAllDataNotifyOuterClass";

import "BattlePassMission.proto";
import "BattlePassSchedule.proto";

message BattlePassAllDataNotify {
	bool have_cur_schedule = 5;
	repeated BattlePassMission mission_list = 4;
	BattlePassSchedule cur_schedule = 9;
	uint32 _battle_pass_plan = 12;
	bool HBHFBAGFADF = 10;
	bool is_viewed = 13;
}
