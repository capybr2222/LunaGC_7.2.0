syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PersonalLineAllDataRspOuterClass";

import "LockedPersonallineData.proto";

message PersonalLineAllDataRsp {
	int32 retcode = 5;
	repeated LockedPersonallineData locked_personal_line_list = 4;
	repeated uint32 CLDEEBFDGDH = 50000;
	uint32 cur_finished_daily_task_count = 7;
	uint32 legendary_key_count = 2;
	repeated uint32 KNJFOGEHNPK = 50001;
	repeated uint32 NIPKCPGAMKF = 20002;
}
