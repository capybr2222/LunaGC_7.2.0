syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChannellerSlabBuffInfoOuterClass";

import "ChannellerSlabAssistInfo.proto";
import "MFLOIKPJCDI.proto";

message ChannellerSlabBuffInfo {
	repeated uint32 buff_id_list = 1;
	MFLOIKPJCDI AKKLDFFAGMI = 20001;
	repeated ChannellerSlabAssistInfo assist_info_list = 4;
	MFLOIKPJCDI EBICDMABNFJ = 20000;
}
