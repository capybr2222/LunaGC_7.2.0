syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneAreaWeatherNotifyOuterClass";

message SceneAreaWeatherNotify {
	uint32 weather_area_id = 3;
	map<uint32, string> weather_value_map = 5;
	float trans_duration = 6;
	uint32 climate_type = 9;
	uint32 weather_gadget_id = 10;
}
