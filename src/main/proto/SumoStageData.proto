syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SumoStageDataOuterClass";

import "SumoTeamData.proto";

message SumoStageData {
	uint32 stage_id = 1;
	repeated SumoTeamData team_list = 5;
	uint32 max_score = 2;
	bool is_open = 4;
	uint32 open_time = 3;
}
