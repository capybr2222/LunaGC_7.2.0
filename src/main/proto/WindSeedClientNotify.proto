syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WindSeedClientNotifyOuterClass";

import "Vector.proto";

message WindSeedClientNotify {

	message RefreshNotify {
		uint32 refresh_type = 3;
	}

	message AddWindBulletNotify {
		Vector pos = 4;
		uint32 bullet_id = 5;
		uint32 entity_id = 8;
	}

	message AreaNotify {
		uint32 area_id = 1;
		bytes area_code = 6;
		uint32 area_type = 11;
	}

	oneof notify {
		RefreshNotify refresh_notify = 6;
		AddWindBulletNotify add_wind_bullet_notify = 7;
		AreaNotify area_notify = 8;
	}
}
