syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LoliRunDungeonSettleInfoOuterClass";

message _LoliRunDungeonSettleInfo {
	uint32 DOCOKIPMPKN = 10;
	uint32 hit_point = 11;
	uint32 score = 13;
	uint32 level_id = 3;
	uint32 collect_num = 15;
	bool is_new_record = 12;
}
