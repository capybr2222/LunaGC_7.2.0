syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ItemAddHintNotifyOuterClass";

import "ItemHint.proto";
import "Vector.proto";

message ItemAddHintNotify {
	bool BLNCGGHFOMI = 50000;
	bool FPCIANIKMKE = 50001;
	uint32 reason = 5;
	Vector position = 11;
	uint32 quest_id = 4;
	repeated ItemHint overflow_transformed_item_list = 6;
	bool is_transfered_from_avatar_card = 50002;
	repeated ItemHint item_list = 9;
}
