syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_Saurus1V3SettleInfoOuterClass";

import "DungeonSettleExhibitionInfo.proto";
import "ExhibitionDisplayInfo.proto";

message _Saurus1V3SettleInfo {
	repeated ExhibitionDisplayInfo score_list = 14;
	repeated uint32 winner_uid_list = 9;
	repeated DungeonSettleExhibitionInfo settle_info_list = 5;
	uint32 LLCEEFFOGBH = 15;
	uint32 score = 6;
}
