syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "NHKBDCPGNMNOuterClass";

import "_ActivityAvatarInfo.proto";

message NHKBDCPGNMN {
	uint32 max_score = 13;
	bool is_open = 6;
	bool is_finish = 3;
	uint32 level_id = 10;
	repeated _ActivityAvatarInfo select_avatar_list = 1;
}
