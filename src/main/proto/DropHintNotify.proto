syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DropHintNotifyOuterClass";

import "Vector.proto";

message DropHintNotify {
	repeated uint32 item_id_list = 5;
	bool AJDBEGMCGKD = 15;
	Vector position = 7;
	Vector rotation = 12;
	uint32 entity_id = 14;
}
