syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityInvokeEntryOuterClass";

import "AbilityInvokeArgument.proto";
import "AbilityInvokeEntryHead.proto";
import "ForwardType.proto";

message AbilityInvokeEntry {
	uint32 event_id = 14;
	double total_tick_time = 12;
	AbilityInvokeEntryHead head = 5;
	bool is_ignore_auth = 6;
	bytes ability_data = 2;
	AbilityInvokeArgument argument_type = 1;
	uint32 entity_id = 7;
	ForwardType forward_type = 11;
	uint32 forward_peer = 4;
}
