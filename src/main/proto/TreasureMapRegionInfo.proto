syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureMapRegionInfoOuterClass";

import "Vector.proto";

message TreasureMapRegionInfo {
	uint32 scene_id = 8;
	Vector region_center_pos = 4;
	uint32 start_time = 3;
	bool CNKNEJNEEOP = 20003;
	uint32 lkcmdifkamb = 50001;
	uint32 region_radius = 5;
	bool PANBKFCPEBJ = 20002;
	uint32 region_id = 1;
	uint32 fggbkhfbkdp = 50003;
}
