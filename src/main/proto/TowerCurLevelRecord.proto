syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerCurLevelRecordOuterClass";

import "TowerTeam.proto";

message TowerCurLevelRecord {
	repeated uint32 buff_id_list = 9;
	uint32 cur_floor_id = 20001;
	repeated TowerTeam tower_team_list = 1;
	optional bool is_upper_part = 2;
	uint32 cur_level_index = 20000;
	bool is_empty = 7;
}
