syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcReqOuterClass";

import "GetUgcType.proto";
import "RecordUsage.proto";
import "UgcType.proto";

message GetUgcReq {
	uint64 ugc_guid = 7;
	RecordUsage ugc_record_usage = 13;
	UgcType ugc_type = 5;
	GetUgcType get_ugc_type = 14;
	bool is_require_brief = 9;
	uint32 schedule_id = 8;
}
