syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LFKPMBBOGDPOuterClass";

import "Vector.proto";

message LFKPMBBOGDP {
	bool is_finish = 3;
	uint32 open_time = 8;
	repeated uint32 GHGKAOABLFK = 20000;
	bool is_open = 2;
	uint32 level_id = 1;
	Vector region_center_pos = 5;
	uint32 scene_id = 7;
	float region_radius = 6;
}
