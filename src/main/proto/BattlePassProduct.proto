syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassProductOuterClass";

message BattlePassProduct {
	string normal_product_id = 7;
	string extra_product_id = 20001;
	string upgrade_product_id = 1;
	string LJKGANJLFNJ = 5;
	string LGOGOFAFJBK = 20000;
}
