syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AsterLittleDetailInfoOuterClass";

import "AsterLittleStageState.proto";

message AsterLittleDetailInfo {
	uint32 begin_time = 4;
	uint32 stage_begin_time = 5;
	AsterLittleStageState stage_state = 3;
	bool is_open = 1;
	uint32 stage_id = 2;
}
