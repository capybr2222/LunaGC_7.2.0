syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EchoShellDetailInfoOuterClass";

import "SummerTimeDungeonInfo.proto";

message EchoShellDetailInfo {
	repeated uint32 MBGIBFEEOLH = 20001;
	repeated uint32 FHIALFGIKKC = 20000;
	repeated SummerTimeDungeonInfo summer_time_dungeon_list = 3;
	repeated uint32 taken_reward_list = 1;
}
