syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonEntryInfoOuterClass";

import "WeeklyBossResinDiscountInfo.proto";

message DungeonEntryInfo {
	uint32 next_refresh_time = 9;
	bool is_passed = 11;
	uint32 boss_chest_num = 20001;
	WeeklyBossResinDiscountInfo weekly_boss_resin_discount_info = 7;
	uint32 max_boss_chest_num = 20000;
	uint32 dungeon_id = 1;
}
