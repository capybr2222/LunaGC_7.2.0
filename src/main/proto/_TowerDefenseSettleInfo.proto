syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TowerDefenseSettleInfoOuterClass";

message _TowerDefenseSettleInfo {
	uint32 _left_hp = 3;
	bool is_new_record = 12;
	uint32 kill_num = 2;
	uint32 _succ_wave = 13;
	uint32 level_id = 8;
	bool is_succ = 7;
	uint32 max_hp = 5;
	uint32 _max_wave = 11;
}
