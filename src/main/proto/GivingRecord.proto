syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GivingRecordOuterClass";

message GivingRecord {
	uint32 config_id = 5;
	uint32 group_id = 6;
	bool is_finished = 13;
	uint32 last_group_id = 1;
	map<uint32, uint32> material_cnt_map = 15;
	uint32 giving_id = 11;
	bool is_gadget_giving = 14;
}
