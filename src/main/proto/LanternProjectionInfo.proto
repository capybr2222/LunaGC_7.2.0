syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanternProjectionInfoOuterClass";

import "ClientInputType.proto";
import "LanternProjectionLevelInfo.proto";

message LanternProjectionInfo {
	repeated uint32 open_stage_list = 1;
	repeated LanternProjectionLevelInfo level_list = 2;
	repeated ClientInputType GOBNJOGJEMP = 20001;
	repeated ClientInputType PLJBMMAMJDL = 20000;
}
