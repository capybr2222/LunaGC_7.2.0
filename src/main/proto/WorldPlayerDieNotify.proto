syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WorldPlayerDieNotifyOuterClass";

import "AbilityString.proto";
import "PlayerDieType.proto";

message WorldPlayerDieNotify {
	oneof entity {
		uint32 monster_id = 8;
		uint32 gadget_id = 4;
	}
	PlayerDieType die_type = 5;
	AbilityString cfadgphidli = 11;
	uint32 OBOKABMLGHI = 20001;
	uint32 AOMDIHGJMNK = 20003;
	uint32 murderer_entity_id = 20002;
}
