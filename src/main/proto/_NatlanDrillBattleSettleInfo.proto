syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_NatlanDrillBattleSettleInfoOuterClass";

message _NatlanDrillBattleSettleInfo {
	bool is_new_record = 13;
	uint32 level_id = 8;
	uint32 difficulty = 3;
	uint32 cost_time = 12;
	repeated uint32 DLDAJAHOKNI = 20000;
	uint32 CJNILLPKODC = 20001;
}
