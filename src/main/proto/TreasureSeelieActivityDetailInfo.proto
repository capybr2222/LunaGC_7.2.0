syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureSeelieActivityDetailInfoOuterClass";

import "TreasureSeelieRegionData.proto";

message TreasureSeelieActivityDetailInfo {
	bool is_content_closed = 3;
	repeated TreasureSeelieRegionData region_data_list = 1;
	uint32 treasure_close_time = 2;
}
