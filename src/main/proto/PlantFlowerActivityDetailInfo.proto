syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlantFlowerActivityDetailInfoOuterClass";

message PlantFlowerActivityDetailInfo {
	bool is_today_has_awarded = 3;
	uint32 today_seed_reward_id = 2;
	map<uint32, uint32> JOIMIBFDKBA = 20001;
	uint32 day_index = 1;
	map<uint32, uint32> NKAHFKHPICE = 20000;
	bool is_content_closed = 4;
}
