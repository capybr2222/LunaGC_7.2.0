syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BulletHellSettleInfoOuterClass";

message _BulletHellSettleInfo {
	uint32 level_id = 1;
	bool is_new_record = 6;
	uint32 GMCOKCLLBCL = 20001;
	uint32 NGJGHEBLBHN = 20002;
	uint32 MMKMPGFBOIL = 20000;
	uint32 score = 2;
}
