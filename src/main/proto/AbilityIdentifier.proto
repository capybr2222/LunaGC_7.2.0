syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityIdentifierOuterClass";

import "LJGEHMILKEM.proto";

message AbilityIdentifier {
	int32 local_id = 8;
	uint32 instanced_modifier_id = 11;
	LJGEHMILKEM FPDAONBEBHK = 1;
	uint32 NBHCDKPBBOI = 20001;
	uint32 DLLKGHINFBJ = 20002;
	uint32 instanced_ability_id = 7;
}
