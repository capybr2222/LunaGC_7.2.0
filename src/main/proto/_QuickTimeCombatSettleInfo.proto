syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_QuickTimeCombatSettleInfoOuterClass";

message _QuickTimeCombatSettleInfo {
	uint32 stage_id = 1;
	uint32 total_score = 4;
	bool is_new_record = 5;
	uint32 difficulty = 2;
	repeated uint32 KKBGBCAOLAP = 3;
}
