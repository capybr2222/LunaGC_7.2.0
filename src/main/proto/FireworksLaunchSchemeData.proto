syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FireworksLaunchSchemeDataOuterClass";

import "FireworksLaunchParam.proto";

message FireworksLaunchSchemeData {
	repeated uint32 fireworks_id_list = 8;
	repeated FireworksLaunchParam launch_param_list = 7;
	uint32 scheme_id = 4;
}
