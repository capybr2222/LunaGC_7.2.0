syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureMapBonusChallengeInfoOuterClass";

message TreasureMapBonusChallengeInfo {
	uint32 solution_id = 5;
	bool is_done = 3;
	bool is_active = 2;
	map<uint32, bool> fragment_map = 4;
	uint32 config_id = 1;
}
