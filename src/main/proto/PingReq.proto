syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PingReqOuterClass";

message PingReq {
	uint64 akgpfdhngbo = 1;
	uint32 _cur_fps = 2;
	bytes MCCPJDKDNMJ = 20001;
	double total_tick_time = 5;
	bytes BLOPFLFBDAE = 20000;
	float ue_time = 10;
	uint32 client_time = 13;
	uint32 seq = 14;
}
