syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "NatlanTourDetailInfoOuterClass";

import "HPKLMGOJCBG.proto";
import "MJDAGPDBODL.proto";
import "OOHHKGLNCIN.proto";

message NatlanTourDetailInfo {
	MJDAGPDBODL DJIOGHINDGP = 50000;
	OOHHKGLNCIN JKJHPFMHOGJ = 50001;
	HPKLMGOJCBG explore_info = 15;
}
