syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WinterCampActivityDetailInfoOuterClass";

import "ItemParam.proto";
import "WinterCampRaceStageInfo.proto";
import "WinterCampStageInfo.proto";

message WinterCampActivityDetailInfo {
	repeated WinterCampRaceStageInfo race_info_list = 4;
	repeated uint32 CNLIGPFPPDC = 20002;
	repeated uint32 LFFBHOJNFDO = 20000;
	repeated ItemParam used_item_list = 8;
	WinterCampStageInfo explore_info = 2;
	repeated uint32 dmjdfjojofj = 50002;
	WinterCampStageInfo battle_info = 3;
	bool is_content_closed = 1;
}
