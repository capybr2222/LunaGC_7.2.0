syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BladeHeartDungeonSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _BladeHeartDungeonSettleInfo {
	bool is_perfect = 9;
	GalleryStopReason reason = 13;
	uint32 use_time = 11;
	uint32 level_id = 12;
	bool is_new_record = 2;
}
