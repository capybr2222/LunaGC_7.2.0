syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanternRiteV6BattleSettleInfoOuterClass";

message _LanternRiteV6BattleSettleInfo {
	uint32 level_id = 4;
	uint32 score = 3;
	uint32 difficulty = 12;
	uint32 use_time = 6;
	bool is_new_record = 15;
}
