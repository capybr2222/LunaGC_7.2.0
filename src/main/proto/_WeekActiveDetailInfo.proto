syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_WeekActiveDetailInfoOuterClass";

message _WeekActiveDetailInfo {
	repeated uint32 JOHCCPGDECJ = 20002;
	uint32 avatar_id = 2;
	repeated uint32 LCOBFDMFKHK = 50001;
	bool _is_week_active_viewed = 12;
	uint32 ILEHAFHFMJN = 14;
	repeated uint32 _claimed_avatar_id_list = 20001;
	uint32 progress = 15;
}
