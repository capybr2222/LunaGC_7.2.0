syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeFurnitureDataOuterClass";

import "Vector.proto";

message HomeFurnitureData {
	int32 parent_furniture_index = 14;
	Vector spawn_pos = 3;
	uint32 version = 11;
	Vector spawn_rot = 2;
	uint32 guid = 7;
	uint32 furniture_id = 10;
}
