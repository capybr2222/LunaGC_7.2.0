syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LunaRiteHintPointOuterClass";

import "LunaRiteHintPointType.proto";
import "Vector.proto";

message LunaRiteHintPoint {
	LunaRiteHintPointType type = 4;
	uint32 index = 1;
	uint32 area_id = 2;
	Vector pos = 3;
}
