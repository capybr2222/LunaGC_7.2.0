syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CoinCollectTeamInfoDataOuterClass";

message CoinCollectTeamInfoData {
	bool is_host = 4;
	uint32 choose_skill_no = 1;
	repeated uint32 avatar_id_list = 2;
	uint32 player_uid = 5;
	repeated uint32 GKOLDEDJJDO = 20000;
	repeated uint32 HJPAFNAACNO = 20001;
}
