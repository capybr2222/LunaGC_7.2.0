syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarEnterSceneInfoOuterClass";

import "AbilitySyncStateInfo.proto";
import "SceneWeaponInfo.proto";
import "ServerBuff.proto";

message AvatarEnterSceneInfo {
	uint64 weapon_guid = 10;
	repeated ServerBuff server_buff_list = 11;
	repeated uint32 buff_id_list = 6;
	repeated SceneWeaponInfo tps_weapon_list = 12;
	uint32 weapon_entity_id = 7;
	uint32 avatar_entity_id = 4;
	AbilitySyncStateInfo avatar_ability_info = 5;
	AbilitySyncStateInfo weapon_ability_info = 8;
	uint64 avatar_guid = 13;
}
