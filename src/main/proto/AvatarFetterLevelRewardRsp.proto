syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarFetterLevelRewardRspOuterClass";

message AvatarFetterLevelRewardRsp {
	repeated uint32 _reward_id_list = 9;
	uint32 fetter_level = 8;
	uint32 reward_id = 12;
	int32 retcode = 3;
	uint64 avatar_guid = 1;
}
