syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InstableSprayStageInfoOuterClass";

import "InstableSprayTeamInfo.proto";

message InstableSprayStageInfo {
	bool is_finished = 3;
	repeated InstableSprayTeamInfo team_info_list = 4;
	uint32 stage_id = 1;
	uint32 max_score = 2;
}
