name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build with Gradle Wrapper
      run: ./gradlew jar

    - name: Locate the jar
      id: jar
      run: |
        path="$(ls LunaGC-*.jar | head -n 1)"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "name=$(basename "$path" .jar)" >> "$GITHUB_OUTPUT"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.jar.outputs.name }}
        path: ${{ steps.jar.outputs.path }}
        if-no-files-found: error

    - name: Publish jar to the "latest" release
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      env:
        GH_TOKEN: ${{ github.token }}
        JAR_PATH: ${{ steps.jar.outputs.path }}
        JAR_NAME: ${{ steps.jar.outputs.name }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        cat > release-notes.md <<EOF
        Automatic build of \`$BRANCH\` at $SHA.

        Download: [\`$JAR_NAME.jar\`](https://github.com/$REPO/releases/latest/download/$JAR_NAME.jar)
        EOF
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest "$JAR_PATH" \
          --title "$JAR_NAME (latest build)" \
          --notes-file release-notes.md \
          --latest